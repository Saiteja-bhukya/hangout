<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #04070a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #04070a;
      }
      .host {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <!-- Full-frame scenes, back to back -->
      <div id="open" class="host" data-composition-id="open" data-composition-src="compositions/open.html" data-start="0" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="stage" class="host" data-composition-id="stage" data-composition-src="compositions/stage.html" data-start="7" data-duration="28" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="endcard" class="host" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="35" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <!-- Type over the 3D stage -->
      <div id="hero" class="host" data-composition-id="hero" data-composition-src="compositions/hero.html" data-start="11.2" data-duration="2.1" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="tour" class="host" data-composition-id="tour" data-composition-src="compositions/tour.html" data-start="13.4" data-duration="16.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="payoff" class="host" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="30.1" data-duration="3.9" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <!-- Music bed: "Familiar Roads" by Tanner Helland (CC BY 4.0), see assets/music/CREDITS.md.
           Starts 52.155 s into the track so a beat lands on the phone reveal at 11.4 s. -->
      <audio id="music" class="clip" src="assets/music/familiar-roads.mp3" data-start="0" data-duration="40" data-media-start="52.155" data-volume="0.53" data-fade-in="0.6" data-fade-out="2.6" data-track-index="5"></audio>

      <!-- Sound effects (Pixabay, see assets/sfx/CREDITS.md); each peaks one frame after its picture -->
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="9.46" data-duration="2" data-media-start="1.5" data-volume="0.38" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="sfx-impact-reveal" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="11.36" data-duration="2.12" data-volume="0.57" data-track-index="3"></audio>
      <audio id="sfx-whoosh-shift" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.57" data-duration="0.57" data-volume="0.36" data-track-index="3"></audio>
      <audio id="sfx-whoosh-spin" class="clip" src="assets/sfx/whoosh.mp3" data-start="23.2" data-duration="0.57" data-volume="0.46" data-track-index="3"></audio>
      <audio id="sfx-pop-coins" class="clip" src="assets/sfx/pop.mp3" data-start="27.62" data-duration="0.72" data-volume="0.38" data-track-index="3"></audio>
      <audio id="sfx-pop-coins-2" class="clip" src="assets/sfx/pop.mp3" data-start="28.4" data-duration="0.72" data-volume="0.25" data-track-index="3"></audio>
      <audio id="sfx-impact-logo" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="35.41" data-duration="2.12" data-volume="0.41" data-track-index="3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
