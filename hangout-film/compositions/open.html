  <script>
    const tl = gsap.timeline({ paused: true });
    const blurIn = (sel, t) =>
      tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, t);
    const blurOut = (sel, t) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, t);

    // "It's" is on screen at frame 0 (the thumbnail); "Saturday." lands after it.
    tl.fromTo("#op-w1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
    blurIn("#op-w2", 0.22);
    blurOut("#op-l1", 1.5);

    // The group chat that never decides (the deck: "40 WhatsApp messages").
    ["#op-w3", "#op-w4", "#op-w5"].forEach((s, i) => blurIn(s, 1.72 + i * 0.067));
    ["#op-w6", "#op-w7", "#op-w8"].forEach((s, i) => blurIn(s, 2.3 + i * 0.067));
    blurOut("#op-l2", 3.55);
    blurOut("#op-l3", 3.6);

    // The number: 68% missed a good venue (Concept Note, own survey).

    const counter = { v: 0 };
    tl.fromTo(
      counter,
      { v: 0 },
      {
        v: 68,
        duration: 1.3,
        ease: "power3.out",
        onUpdate: () => {
          document.getElementById("op-num").textContent = Math.round(counter.v);
        },
      },
      3.8,
    );
    blurIn("#op-s1", 4.4);
    blurIn("#op-s2", 4.55);
    tl.fromTo("#op-src", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.1);
    blurOut("#op-stat", 6.72);
    blurOut("#op-sub", 6.76);
    blurOut("#op-src", 6.76);
    window.__timelines["open"] = tl;
