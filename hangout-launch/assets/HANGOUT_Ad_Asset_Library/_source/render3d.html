<!doctype html>
<html><head><meta charset="utf-8"><title>HANGOUT 3D renderer</title></head>
<body style="margin:0;background:transparent">
<script>
// ---------- tiny flat-shaded 3D renderer (painter's algorithm) ----------
const PI = Math.PI;
const M = {
  body:   { c: [22, 38, 64],   spec: .55 },
  metal:  { c: [70, 92, 122],  spec: .8 },
  dark:   { c: [10, 16, 28],   spec: .3 },
  white:  { c: [226, 236, 246], spec: .7 },
  ball:   { c: [28, 52, 110],  spec: .9 },
  glass:  { c: [18, 40, 70],   spec: 1 },
  ecy:    { e: [54, 214, 242] },
  eice:   { e: [150, 240, 255] },
  eblue:  { e: [57, 123, 255] },
  elil:   { e: [183, 169, 255] },
  egold:  { e: [233, 203, 126] },
};
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const T = {
  tr: (x, y, z) => p => [p[0] + x, p[1] + y, p[2] + z],
  sc: (x, y, z) => p => [p[0] * x, p[1] * (y ?? x), p[2] * (z ?? x)],
  rx: a => { const c = Math.cos(a), s = Math.sin(a); return p => [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; },
  ry: a => { const c = Math.cos(a), s = Math.sin(a); return p => [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; },
  rz: a => { const c = Math.cos(a), s = Math.sin(a); return p => [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]]; },
};
function xf(faces, ...fns) { return faces.map(f => ({ ...f, pts: f.pts.map(p => fns.reduce((q, fn) => fn(q), p)) })); }
function box(w, h, d, mat) {
  const x = w / 2, y = h / 2, z = d / 2;
  const v = [[-x, -y, -z], [x, -y, -z], [x, y, -z], [-x, y, -z], [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z]];
  return [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [3, 2, 6, 7], [0, 3, 7, 4], [1, 2, 6, 5]].map(ix => ({ pts: ix.map(i => v[i]), mat, edge: true }));
}
function lathe(prof, seg, mat, a0 = 0, a1 = 2 * PI, edge = false) {
  const out = [];

    const t0 = a0 + (a1 - a0) * i / seg, t1 = a0 + (a1 - a0) * (i + 1) / seg;

      const [r0, y0] = prof[j], [r1, y1] = prof[j + 1];

}
function cyl(r, h, seg, mat, capMat) {
  const f = lathe([[r, -h / 2], [r, h / 2]], seg, mat);
  const top = [], bot = [];
  for (let i = 0; i < seg; i++) { const t = 2 * PI * i / seg; top.push([r * Math.cos(t), h / 2, r * Math.sin(t)]); bot.push([r * Math.cos(t), -h / 2, r * Math.sin(t)]); }

}
function sphere(r, seg, mat) { const p = []; for (let i = 0; i <= seg / 2; i++) { const a = -PI / 2 + PI * i / (seg / 2); p.push([r * Math.cos(a), r * Math.sin(a)]); } return lathe(p, seg, mat); }
function torus(R, r, su, sv, mat, u0 = 0, u1 = 2 * PI) {

}
// ---------- render ----------
function norm(v) { const l = Math.hypot(...v) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }

      path(gg, f); gg.fillStyle = `rgb(${m.e.join(',')})`; gg.fill();
    } else {
      const dif = Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
      const dif2 = Math.max(0, n[0] * L2[0] + n[1] * L2[1] + n[2] * L2[2]);
      const sp = Math.pow(Math.max(0, n[0] * H[0] + n[1] * H[1] + n[2] * H[2]), 28) * m.spec;
      const rim = Math.pow(1 - Math.abs(n[2]), 2.4);
      col = m.c.map((c, i) => c * (.32 + .9 * dif + .25 * dif2) + 255 * sp * .55 + [54, 214, 242][i] * rim * .55);
      col = col.map(c => Math.max(0, Math.min(255, c)));
    }
    path(g, f); g.fillStyle = `rgb(${col.map(Math.round).join(',')})`; g.fill();
    g.strokeStyle = f.edge && !m.e ? 'rgba(127,230,247,.28)' : `rgb(${col.map(Math.round).join(',')})`; g.lineWidth = f.edge ? lw * 1.4 : lw * .9; g.stroke();
  });

  const out = document.createElement('canvas'); out.width = out.height = size; const o = out.getContext('2d');
  o.filter = `blur(${size / 34}px)`; o.globalAlpha = mode === 'holo' ? .8 : .75; o.drawImage(gl, 0, 0);

}

const S = {};
S.arcade = { cam: { yaw: -32, pitch: 12, dist: 7 }, build() {

S.vr = { cam: { yaw: 28, pitch: 10, dist: 6 }, build() {

S.bowling = { cam: { yaw: -20, pitch: 10, dist: 9 }, build() {

S.trampoline = { cam: { yaw: -10, pitch: 30, dist: 8 }, build() {

S.escape = { cam: { yaw: -24, pitch: 8, dist: 7 }, build() {

S.cafe = { cam: { yaw: -26, pitch: 14, dist: 8 }, build() {
  let f = [];
