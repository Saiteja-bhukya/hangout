<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #fef8f3;
        --ink: #0e162a;
        --ink-2: #4a5568;
        --brand: #0040ff;
        --peach: #fec8b4;
        --lavender: #d7cdfa;
        --mint: #b0e9db;
        --sky: #becffc;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--ground);
      }
      .blob {
        position: absolute;
        border-radius: 50%;
      }
      #blob-peach {
        width: 1500px;
        height: 1300px;
        left: -520px;
        top: -560px;
        background: radial-gradient(closest-side, var(--peach) 0%, rgba(254, 200, 180, 0.75) 45%, rgba(254, 200, 180, 0) 100%);
      }
      #blob-lavender {
        width: 1400px;
        height: 1200px;
        left: 1080px;
        top: -560px;
        background: radial-gradient(closest-side, var(--lavender) 0%, rgba(215, 205, 250, 0.7) 45%, rgba(215, 205, 250, 0) 100%);
      }
      #blob-mint {
        width: 1300px;
        height: 1100px;
        left: 1180px;
        top: 560px;
        background: radial-gradient(closest-side, var(--mint) 0%, rgba(176, 233, 219, 0.7) 45%, rgba(176, 233, 219, 0) 100%);
      }
      #blob-sky {
        width: 1200px;
        height: 1100px;
        left: -500px;
        top: 560px;
        background: radial-gradient(closest-side, var(--sky) 0%, rgba(190, 207, 252, 0.7) 45%, rgba(190, 207, 252, 0) 100%);
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1920"
      data-height="1080"
    >
      <!-- Test365's own pastel ground, drifting slowly under every scene -->
      <div id="ground" data-layout-ignore>
        <div id="blob-peach" class="blob"></div>
        <div id="blob-lavender" class="blob"></div>
        <div id="blob-mint" class="blob"></div>
        <div id="blob-sky" class="blob"></div>
      </div>

      <!-- Scenes, back to back on one lane -->
      <div
        id="hook"
        class="scene-host"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="4.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="need"
        class="scene-host"
        data-composition-id="need"
        data-composition-src="compositions/need.html"
        data-start="4.2"
        data-duration="3.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="reveal"
        class="scene-host"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-start="8"
        data-duration="1.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="tour"
        class="scene-host"
        data-composition-id="tour"
        data-composition-src="compositions/tour.html"
        data-start="9.9"
        data-duration="20.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>
      <div
        id="endcard"
        class="scene-host"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="30.2"
        data-duration="4.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 6"
      ></div>

      <!-- Sound effects (Pixabay, see assets/sfx/CREDITS.md); each peaks one frame after its picture -->
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="6.48" data-duration="2" data-media-start="1.5" data-volume="0.45" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="sfx-whoosh-need" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.55" data-duration="0.57" data-volume="0.55" data-track-index="2"></audio>
      <audio id="sfx-impact-logo" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="8.41" data-duration="2.12" data-volume="0.7" data-track-index="2"></audio>
      <audio id="sfx-whoosh-morph" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.57" data-duration="0.57" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-pop-xp" class="clip" src="assets/sfx/pop.mp3" data-start="28.66" data-duration="0.72" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-whoosh-exit" class="clip" src="assets/sfx/whoosh.mp3" data-start="29.92" data-duration="0.57" data-volume="0.55" data-track-index="2"></audio>
      <audio id="sfx-pop-cta" class="clip" src="assets/sfx/pop.mp3" data-start="31.11" data-duration="0.72" data-volume="0.55" data-track-index="2"></audio>
      <audio id="sfx-click-cta" class="clip" src="assets/sfx/click.mp3" data-start="32.21" data-duration="0.37" data-volume="0.8" data-track-index="2"></audio>
      <audio id="sfx-pop-chips" class="clip" src="assets/sfx/pop.mp3" data-start="32.69" data-duration="0.72" data-volume="0.4" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // The ground drifts at 3-5 px/s for the whole film (linear: constant speed is the point).
      tl.fromTo("#blob-peach", { x: 0, y: 0 }, { x: 140, y: 90, duration: 35, ease: "none" }, 0);
      tl.fromTo("#blob-lavender", { x: 0, y: 0 }, { x: -120, y: 110, duration: 35, ease: "none" }, 0);
      tl.fromTo("#blob-mint", { x: 0, y: 0 }, { x: -150, y: -80, duration: 35, ease: "none" }, 0);
      tl.fromTo("#blob-sky", { x: 0, y: 0 }, { x: 130, y: -100, duration: 35, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
