<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Inter", sans-serif;
      color: #0e162a;
    }
    #hook-line {
      position: absolute;
      left: 160px;
      top: 352px;
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.05;
    }
    #hook-slot {
      position: absolute;
      left: 160px;
      top: 470px;
      width: 1620px;
      height: 170px;
      overflow: hidden;
    }
    .hook-word {
      position: absolute;
      left: 0;
      top: 12px;
      font-size: 116px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #0040ff;
      white-space: nowrap;
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hook-line">Are you preparing for</div>
    <div id="hook-slot" data-layout-allow-overflow>
      <div id="hook-w1" class="hook-word">JEE Main</div>
      <div id="hook-w2" class="hook-word">NEET</div>
      <div id="hook-w3" class="hook-word">GATE CS</div>
      <div id="hook-w4" class="hook-word">GATE Biotechnology</div>
      <div id="hook-w5" class="hook-word">IIT JAM Biotechnology?</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // The line is on screen from frame 0 (the thumbnail) and holds dead still.
    tl.fromTo("#hook-line", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);

    // Slot machine: each exam rolls up into the slot and holds long enough to read.
    const ins = [0.25, 1.05, 1.65, 2.25, 2.95];
    ins.forEach((t, i) => {
      const id = "#hook-w" + (i + 1);
      tl.fromTo(
        id,
        { yPercent: 100, opacity: 0, filter: "blur(6px)" },
        { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" },
        t,
      );
      if (i < ins.length - 1) {
        tl.to(
          id,
          { yPercent: -100, opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power3.in" },
          ins[i + 1] - 0.02,
        );
      }
    });

    // Blur swap out: the question clears the stage for the need.
    tl.to("#hook-line", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 3.85);
    tl.to("#hook-w5", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 3.92);
    window.__timelines["hook"] = tl;
  </script>
</template>
