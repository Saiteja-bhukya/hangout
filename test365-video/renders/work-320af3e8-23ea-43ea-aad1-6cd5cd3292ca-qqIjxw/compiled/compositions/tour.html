  <script>
    const tl = gsap.timeline({ paused: true });

    // Camera helper: focus point (cx, cy) in source-pixel coordinates of the 626x436 recording crop
    // (852x350 for the homepage), scale s, clamped so the screen always fills its window.
    function cam(cx, cy, s, W, H, k) {
      const x = Math.min(0, Math.max(W - W * s, W / 2 - cx * k * s));
      const y = Math.min(0, Math.max(H - H * s, H / 2 - cy * k * s));
      return { x: x, y: y, scale: s };
    }
    const FW = 980, FH = 682, FK = 980 / 626;
    const HW = 1600, HH = 657, HK = 1600 / 852;

    // ---- Carry: the mark flies into the homepage nav, the homepage builds around it ----
    tl.fromTo("#tour-chip", { x: 0, y: 0, scale: 1 }, { x: -576.5, y: -223.5, scale: 0.468, duration: 0.7, ease: "power3.inOut" }, 0.05);
    tl.to("#tour-chip", { backgroundColor: "rgba(255,255,255,0)", boxShadow: "0 0 0 rgba(14,22,42,0)", duration: 0.3, ease: "power2.inOut" }, 0.42);
    tl.to("#tour-chip", { opacity: 0, duration: 0.12, ease: "power2.out" }, 0.74);
    tl.fromTo("#tour-home", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.15);
    tl.fromTo("#tour-home-cam", { x: 0, y: 0, scale: 1 }, { x: 0, y: 0, scale: 1, duration: 0.01 }, 0);
    // Push in on the headline.
    // Anchored bottom-left: the nav leaves frame entirely and the whole headline fills it.
    tl.to("#tour-home-cam", { x: 0, y: HH - HH * 1.6, scale: 1.6, duration: 0.6, ease: "power2.inOut" }, 1.3);

    // ---- Morph: the homepage window becomes the feature stage ----
    tl.to("#tour-home", { x: 350, scale: 0.6125, duration: 0.6, ease: "power3.inOut" }, 3.5);
    tl.to("#tour-home", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 3.52);
    tl.fromTo("#tour-win", { x: -350, scale: 1.633, opacity: 0 }, { x: 0, scale: 1, duration: 0.6, ease: "power3.inOut" }, 3.5);
    tl.fromTo("#tour-win", { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 3.62);
    tl.to("#tour-win", { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.6);
    tl.fromTo("#tour-s0", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 3.5);

    // ---- Six features, 2.8 s each ----
    const F = [3.5, 6.3, 9.1, 11.9, 14.7, 17.5];
    const words = [3, 4, 3, 2, 2, 1];
    // Focus points in recording-crop pixels: the component each caption talks about.
    const focus = [
      [140, 227, 1.7], // notes: "Physics and Measurement" chapter card
      [200, 232, 1.6], // PYQs: the 2021 badge and "JEE Main 2021 · August 27 · Shift 2"
      [290, 165, 1.6], // mock tests: JEE Main Original Mock 1
      null, // analytics: two-stage zoom below
      [280, 175, 1.3], // mistakes: the question and its options
      [430, 62, 1.8], // leaderboards: Friends / 16 XP bar
    ];

    F.forEach((f, i) => {
      // Screen: blur swap on the one stage.
      if (i > 0) {
        const prev = i === 4 ? "#tour-s3b" : "#tour-s" + (i - 1);
        tl.to(prev, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, f);
        tl.fromTo(
          "#tour-s" + i,
          { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" },
          f + 0.05,
        );
      }
      tl.fromTo("#tour-c" + i, { x: 0, y: 0, scale: 1 }, { x: 0, y: 0, scale: 1, duration: 0.01 }, Math.max(0, f - 0.02));

      // Caption: words blur in, then the line under them.
      const cin = i === 0 ? f + 0.45 : f + 0.1;
      for (let j = 0; j < words[i]; j++) {
        tl.fromTo(
          "#tour-w" + i + "-" + j,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" },
          cin + j * 0.067,
        );
      }
      tl.fromTo("#tour-p" + i, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, cin + 0.28);
      // Caption out just before the next swap (the last one leaves with the window).
      const cout = i < 5 ? F[i + 1] - 0.18 : 19.85;
      tl.to("#tour-cap" + i, { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power3.in" }, cout);

      // Punch in on the component.
      if (focus[i]) {
        const [cx, cy, s] = focus[i];
        tl.to("#tour-c" + i, Object.assign(cam(cx, cy, s, FW, FH, FK), { duration: 0.55, ease: "power2.inOut" }), f + 0.8);
      }
    });

    // Analytics: zoom through the dashboard into the reading-progress card.
    const fa = F[3];
    tl.to("#tour-c3", Object.assign(cam(610, 260, 1.8, FW, FH, FK), { duration: 0.45, ease: "power3.in" }), fa + 0.6);
    tl.to("#tour-s3", { filter: "blur(6px)", duration: 0.45, ease: "power3.in" }, fa + 0.6);
    tl.fromTo("#tour-s3b", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, fa + 0.95);
    tl.to("#tour-s3", { opacity: 0, duration: 0.1, ease: "power2.in" }, fa + 1.05);
    tl.fromTo(
      "#tour-c3b",
      cam(313, 218, 1.12, FW, FH, FK),
      Object.assign({ x: 0, y: 0, scale: 1 }, { duration: 0.4, ease: "expo.out" }),
      fa + 0.95,
    );
    tl.to("#tour-c3b", Object.assign(cam(427, 248, 1.3, FW, FH, FK), { duration: 0.5, ease: "power2.inOut" }), fa + 1.55);

    // ---- Exit: the stage whips out to the right ----
    tl.to("#tour-win", { x: 1250, opacity: 0, filter: "blur(16px)", duration: 0.28, ease: "power3.in" }, 19.92);

    window.__timelines["tour"] = tl;
  </script>
